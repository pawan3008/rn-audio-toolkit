buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["AudioKit_" + name]
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
  }
}

apply plugin: "com.android.library"
if (project.hasProperty("newArchEnabled") && project.newArchEnabled == "true") {
  apply plugin: "com.facebook.react"
}
apply plugin: "kotlin-android"

android {
  namespace "com.audiokit"
  compileSdkVersion getExtOrDefault("compileSdkVersion") ?: 34

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion") ?: 23
    targetSdkVersion getExtOrDefault("targetSdkVersion") ?: 34
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java", "src/main/kotlin"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
  implementation "androidx.core:core-ktx:1.12.0"
  implementation "androidx.lifecycle:lifecycle-process:2.7.0"
  implementation "androidx.media3:media3-exoplayer:1.4.1"
  implementation "androidx.media3:media3-common:1.4.1"
  implementation "androidx.media3:media3-session:1.4.1"
}
